plugin-deploy-local:
    candy:
        description: |-
            OUT-OF-TREE charly DEPLOY plugin serving the `local` deploy SUBSTRATE —
            `target: local` (host:local direct-shell) and `host: user@machine` (SSH)
            deploys. A standalone Go module (go.mod + main.go) served over go-plugin gRPC
            via the charly plugin SDK; charly's loader host-builds the provider binary and
            connects it OUT-OF-PROCESS (LocalTransport). The host's plugin-side deploy target's
            Add Invokes it (OpExecute) with the deployment's InstallPlan VIEWS (the serializable
            per-step IR, with secrets injected + {{.Home}} resolved + each step's teardown
            ops captured host-side) + a venue descriptor, and the host's executor served on
            the broker (ShellExecutor for host:local, SSHExecutor for host:user@machine).
            The plugin dials BACK through the SDK Executor and hands the plans to the shared
            kit.WalkPlans: the plugin-renderable step kinds (Op/File/ShellHook +
            env.d-managed-block/ShellSnippet/Service*/RepoChange) it EXECUTES itself via the
            F2 reverse legs (RunSystem/RunUser/PutFile), echoing the host-computed reverse
            ops; the HOST-ENGINE kinds (Builder/LocalPkgInstall/SystemPackages/act-Op/
            ExternalPlugin) it drives over the RunHostStep reverse leg. It returns the
            combined plugin-script + host-step reverse ops the host records in the install
            ledger and replays at `charly deploy del`. The local-substrate production
            sibling of candy/plugin-example-deploy (the F2/F3 witness) and candy/plugin-kube
            (deploy:kubernetes); it replaces the former in-proc LocalDeployTarget.
        plugin:
            providers:
                - deploy:local
            source: github.com/opencharly/plugin-deploy-local/candy/plugin-deploy-local
        plan:
            - check: the out-of-tree deploy:local plugin ships a buildable Go module (go.mod + the provider main) the host can build + serve out-of-process
              id: deploy-local-module-present
              context:
                - build
              command: "true"

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
local-deploy-skill:
  skill:
    name: local-deploy
    family: local
    owner: plugin-deploy-local
    triggers:
      - "local-target deploy / `target: local` / `host: local` (default) / SSH-host deploys / `user:` / `ssh_arg:`"
      - "Managed `~/.config/charly/ssh_config` fragment / `charly vm create` writes Host stanza"
